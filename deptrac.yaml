deptrac:
  paths:
    - ./src
  layers:
    # The composition root: the only class that wires every layer together.
    - name: EntryPoint
      collectors:
        - type: classNameRegex
          value: '#^MSSTC4PHP\\DtoGenerator\\DtoGenerator$#'
    - name: Domain
      collectors:
        - type: directory
          # Everything under Domain except the Builder, so new subdirectories are covered automatically.
          value: src/Domain/(?!Builder/).*
    - name: DomainService
      collectors:
        - type: directory
          value: src/Domain/Builder/.*
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: src/Presentation/.*
    - name: Extension
      collectors:
        - type: directory
          value: src/Extension/.*
    # PHPStan type aliases (Domain\Shared\Json, Presentation\Cli\JsonReport); deptrac resolves them as if they were classes.
    - name: TypeAlias
      collectors:
        - type: classNameRegex
          value: '#^MSSTC4PHP\\DtoGenerator\\.*\\(Json(Value|Scalar)|ReportShape|ChangeShape|DiagnosticShape)$#'
    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\#'
    - name: PhpParser
      collectors:
        - type: classNameRegex
          value: '#^PhpParser\\#'
    - name: Composer
      collectors:
        - type: classNameRegex
          value: '#^Composer\\#'
  ruleset:
    EntryPoint: [Domain, DomainService, Contract, Application, Infrastructure, Presentation, Extension, TypeAlias, Symfony, Composer]
    Domain: [TypeAlias]
    DomainService: [Domain, TypeAlias]
    Contract: [Domain, TypeAlias]
    Application: [Domain, DomainService, Contract, TypeAlias]
    Infrastructure: [Domain, Application, Contract, TypeAlias, Symfony, PhpParser, Composer]
    Presentation: [Application, Domain, Contract, TypeAlias, Symfony, Composer]
    Extension: [Contract, Domain, TypeAlias]
    TypeAlias: ~
    Symfony: ~
    PhpParser: ~
    Composer: ~
