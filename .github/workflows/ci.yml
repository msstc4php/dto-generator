name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per pull request, so a new push cancels its older run; one per commit on main, so each one runs.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.dependencies }}-
      - name: Install dependencies
        # composer.json pins the platform to 7.4 for local installs; CI resolves for the PHP it runs on.
        run: |
          composer config platform --unset
          composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Lint sources with this PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        run: vendor/bin/phpunit

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer install --no-interaction --no-progress --working-dir=tools
      - run: tools/vendor/bin/phpstan analyse --memory-limit=512M -c phpstan.dist.neon --no-progress
      - run: tools/vendor/bin/php-cs-fixer check
      - run: composer validate --strict --no-check-publish
      - run: tools/vendor/bin/rector process -n
      - run: tools/vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress --fail-on-uncovered
      - run: composer audit

  bc:
    name: BC check (Roave)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the check reads the previous release from git
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --working-dir=tools
      # The public API is the SPI and the entry points (.roave-backward-compatibility-check.xml). A pushed release tag
      # is compared with the stable tag before it; without one there is nothing to compare.
      - run: |
          head=HEAD
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            head=HEAD^
          fi
          if ! base=$(git describe --tags --abbrev=0 --exclude='*-*' "${head}" 2>/dev/null); then
            echo "No stable release tag yet: nothing to compare against."
            exit 0
          fi
          echo "Comparing against ${base}"
          tools/vendor/bin/roave-backward-compatibility-check --from="${base}" --install-development-dependencies --format=github-actions --no-interaction

  targets:
    name: Generated code on PHP 7.4–8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer install --no-interaction --no-progress --working-dir=tools
      - run: make test-targets

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: composer install --no-interaction --no-progress
      - run: composer install --no-interaction --no-progress --working-dir=tools
      - run: make infection

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: make docker-smoke
