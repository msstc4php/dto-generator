openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
        tag:
          $ref: '#/components/schemas/Tag'
        price:
          $ref: 'shared/common.json#/definitions/Money'
    Tag:
      type: object
      properties:
        label:
          type: [string, 'null']
