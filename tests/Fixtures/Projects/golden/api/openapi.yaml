openapi: 3.1.0
info:
  title: Golden project
  version: '1'
paths: {}
components:
  schemas:
    User:
      type: object
      description: |
        A registered user.
        Created on sign-up.
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
          description: Identifier.
        email:
          type: string
          format: email
          x-php-attributes:
            - class: App\Attr\Sensitive
              args: { mask: '*', keep: 4 }
          x-audit: personal
        name:
          type: [string, 'null']
          minLength: 1
        createdAt:
          type: string
          format: date-time
        externalId:
          type: string
          format: uuid
        age:
          type: integer
          minimum: 0
          maximum: 150
        score:
          type: number
          default: 0.5
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        address:
          $ref: 'shared/common.yaml#/Address'
        nick_name:
          type: string
          x-php-name: nickname
        legacy:
          type: string
          deprecated: true
        timeZone:
          type: string
          x-php-type: DateTimeZone
        status:
          type: string
          enum: [active, blocked]
          default: active
        role:
          $ref: '#/components/schemas/Role'
        preferences:
          type: object
          properties:
            newsletter:
              type: boolean
            channels:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
        labels:
          type: object
          additionalProperties:
            type: string
    Tag:
      type: object
      x-audit: public
      required: [label]
      properties:
        label:
          type: string
    Settings:
      type: object
      x-dto-mutable: true
      properties:
        theme:
          type: string
          default: dark
      additionalProperties:
        type: integer
    Role:
      type: integer
      description: Access level.
      enum: [1, 2, 3]
      x-enum-descriptions:
        '1': Reader.
        '3': Owner.
    Pet:
      description: A pet of either kind.
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
    Cat:
      type: object
      required: [petType, name]
      properties:
        petType:
          type: string
        name:
          type: string
        lives:
          type: integer
          default: 9
    Dog:
      type: object
      required: [petType, name]
      properties:
        petType:
          type: string
        bark:
          type: boolean
        name:
          type: string
    Person:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        nickname:
          type: string
    Employee:
      description: A person on the payroll.
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [salary]
          properties:
            salary:
              type: number
            manager:
              oneOf:
                - $ref: '#/components/schemas/Person'
                - type: string
                - type: 'null'
    Contact:
      x-php-all-of: merge
      allOf:
        - $ref: '#/components/schemas/Person'
        - $ref: '#/components/schemas/Tag'
    Owner:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        badge:
          description: The badge on the collar.
          allOf:
            - $ref: '#/components/schemas/Tag'
        code:
          anyOf:
            - type: integer
            - type: string
        favourite:
          oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
            - type: 'null'
    Vehicle:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
      discriminator:
        propertyName: kind
    Car:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            doors:
              type: integer
    Payment:
      type: object
      required: [kind, method]
      properties:
        kind: {const: card}
        method:
          oneOf:
            - {type: object, title: card details, required: [number], properties: {number: {type: string}}}
            - {type: object, properties: {iban: {type: string}}}
        level: {type: integer, enum: [1, 2], x-enum-varnames: [Basic, Premium]}
    Labels:
      type: array
      items: {type: object, properties: {text: {type: string}}}
    Shipment:
      description: A shipment, told apart by an enum.
      oneOf:
        - $ref: '#/components/schemas/Parcel'
        - $ref: '#/components/schemas/Letter'
      discriminator:
        propertyName: mode
        mapping:
          parcel: '#/components/schemas/Parcel'
          box: '#/components/schemas/Parcel'
          letter: '#/components/schemas/Letter'
    ShipmentMode:
      type: string
      enum: [parcel, box, letter]
    Parcel:
      type: object
      required: [mode, weight]
      properties:
        mode: {$ref: '#/components/schemas/ShipmentMode'}
        weight: {type: number}
    Letter:
      type: object
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/ShipmentMode'}
        stamp: {type: string}
